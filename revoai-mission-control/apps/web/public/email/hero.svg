<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="280" viewBox="0 0 600 280">
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FAF7F2"/>
      <stop offset="100%" stop-color="#F4EDE1"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#F4D798" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#F4D798" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#F4D798" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="petal" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#F5C9CE"/>
      <stop offset="70%" stop-color="#E8A8AF"/>
      <stop offset="100%" stop-color="#C98991"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B6C8A5"/>
      <stop offset="100%" stop-color="#7F9868"/>
    </linearGradient>
    <linearGradient id="leafDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8AA076"/>
      <stop offset="100%" stop-color="#5F7A4E"/>
    </linearGradient>
  </defs>

  <rect width="600" height="280" fill="url(#canvas)"/>

  <circle cx="480" cy="90" r="140" fill="url(#sunGlow)"/>
  <circle cx="480" cy="90" r="38" fill="#F4D798" fill-opacity="0.55"/>

  <g transform="translate(100, 210)" opacity="0.85">
    <path d="M 0 0 Q -30 -40 -10 -70 Q 0 -55 0 -25 Z" fill="url(#leafDark)"/>
    <path d="M 0 0 Q 30 -40 10 -70 Q 0 -55 0 -25 Z" fill="url(#leaf)"/>
    <line x1="0" y1="0" x2="-2" y2="-60" stroke="#5F7A4E" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <g transform="translate(70, 220)" opacity="0.75">
    <path d="M 0 0 Q -18 -22 -6 -42 Q 0 -32 0 -15 Z" fill="url(#leaf)"/>
    <path d="M 0 0 Q 18 -22 6 -42 Q 0 -32 0 -15 Z" fill="url(#leafDark)"/>
  </g>

  <g transform="translate(530, 200)" opacity="0.8">
    <ellipse cx="0" cy="0" rx="38" ry="16" fill="url(#petal)" fill-opacity="0.85" transform="rotate(-15)"/>
    <ellipse cx="0" cy="0" rx="30" ry="12" fill="url(#petal)" fill-opacity="0.9" transform="rotate(35)"/>
    <ellipse cx="0" cy="0" rx="22" ry="9" fill="url(#petal)" transform="rotate(-55)"/>
    <circle cx="0" cy="0" r="6" fill="#D4AF37"/>
  </g>

  <g transform="translate(50, 250)" opacity="0.45">
    <circle cx="0" cy="0" r="3" fill="#E8B4B8"/>
    <circle cx="14" cy="-4" r="2" fill="#D4AF37"/>
    <circle cx="24" cy="2" r="2.5" fill="#9CAF88"/>
    <circle cx="36" cy="-6" r="2" fill="#E8B4B8"/>
  </g>

  <text x="44" y="100" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700" fill="#2A2824" letter-spacing="-1">Every call, answered.</text>
  <text x="46" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="400" font-style="italic" fill="#6B6159" letter-spacing="-0.5">With care. Day or night.</text>

  <rect x="46" y="175" width="40" height="2" rx="1" fill="#D4AF37"/>
  <text x="46" y="200" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#6B6159" letter-spacing="0.8">An AI receptionist crafted for local businesses.</text>
</svg>
